name: Static checks
on:
  push:
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: |
          set -eu
          for script in *.sh; do bash -n "$script"; done
      - name: Check Python syntax
        run: python3 -m compileall -q build-installer.py serve-installer.py
      - name: Confirm installer template reproducibility
        run: |
          python3 build-installer.py
          git diff --exit-code -- client-install.sh
