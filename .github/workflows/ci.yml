name: Static checks
on:
  push:
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: |
          set -eu
          for script in *.sh scripts/*.sh tests/*.sh; do bash -n "$script"; done
      - name: Check Python syntax
        run: python3 -m compileall -q build-installer.py configuration.py serve-installer.py scripts tests
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Check policy-routing ownership and preference allocation
        run: bash tests/test_policy_routing.sh
      - name: Confirm installer template reproducibility
        run: |
          python3 build-installer.py
          bash -n build/client-install.sh
          python3 build-installer.py --output-dir "$RUNNER_TEMP/vpn-proxy-build"
          diff -ru build "$RUNNER_TEMP/vpn-proxy-build"
  linux-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install integration dependencies
        run: sudo apt-get update && sudo apt-get install -y squid nftables iproute2 curl
      - name: Parse Squid and exercise actual firewall and VPN fallback
        run: sudo bash tests/test-killswitch.sh --systemd
      - name: Verify host selectors and IPv6 policy ordering against the kernel
        run: sudo bash tests/test_policy_routing_kernel.sh
  deployment-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install real deployment dependencies
        run: sudo apt-get update && sudo apt-get install -y squid nftables iproute2 curl util-linux
      - name: Run fault-injection deployment drill on a real systemd host
        env:
          DRILL_CONFIRM_DISPOSABLE: '1'
        run: sudo --preserve-env=DRILL_CONFIRM_DISPOSABLE bash tests/test-deployment-drill.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate Windows installer
        run: python build-installer.py
      - name: Windows PowerShell 5.1 regression
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/test-windows.ps1
      - name: PowerShell 7 regression
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tests/test-windows.ps1
